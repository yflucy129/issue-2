<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 Verbing</title>
<style>
:root{
  --cw:75px; --ch:97px; --ox:0px; --cols:18;
  --big:calc(var(--ch) * .88);
  --mid:calc(var(--ch) * .42);
  --body:clamp(12px, calc(var(--cw) * .2), 17px);
  --small:clamp(9px, calc(var(--cw) * .14), 13px);
  --box:clamp(8px, calc(var(--cw) * .14), 12px);
  --mono:"Courier New", Courier, monospace;
  --paper:#ffffff; --ink:#e6007e; --line:#f6aacf; --wash:#fde6f1;
  --pink:#e6007e;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#fff}
body{color:var(--ink);font-family:var(--mono);font-size:var(--body);line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- the grid: cells of one fixed proportion (8.5 : 11); unopened cells are struck ---------- */
.field,#home{
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,var(--line) 1px,transparent 1px),
    linear-gradient(to bottom,var(--line) 1px,transparent 1px),
    linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px));
  background-size:var(--cw) var(--ch);
  background-position:var(--ox) 0;
}
.open{
  position:relative;min-width:0;min-height:0;
  background-color:var(--paper);
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);
  background-size:var(--cw) var(--ch);
}

/* ---------- HOME: one long scroll, act by act ---------- */
#home{position:fixed;inset:0;overflow:hidden;background:var(--paper);touch-action:manipulation}
.strip{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .8s cubic-bezier(.65,0,.35,1)}
.page{position:relative;flex:none;width:var(--vw,100vw);height:100%;overflow:hidden}
.pgrid{position:absolute;left:var(--ox);top:0;display:grid;grid-template-columns:repeat(var(--cols),var(--cw));grid-auto-rows:var(--ch)}
.page.lobby{background-color:var(--wash);background-image:none}
.page.pink{background-color:var(--pink);background-image:linear-gradient(to right,rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.45) 1px,transparent 1px)}
.page.lobby.pink{background-image:none}
.page.just{animation:pinkin .6s ease both}
@keyframes pinkin{from{background-color:var(--paper)}to{background-color:var(--pink)}}
.navarrow{position:fixed;z-index:5;border:0;padding:0;margin:0;cursor:pointer;display:grid;place-items:center;font-size:var(--big);line-height:1;color:var(--ink);
  background-color:var(--paper);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% 100%;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.navarrow[hidden]{display:none}
.navarrow:hover{background-color:var(--wash)}
.navarrow.locked{color:var(--line);cursor:not-allowed}
.navarrow.locked:hover{background-color:var(--paper)}
.hgrid{position:relative;margin-left:var(--ox);width:calc(var(--cw) * var(--cols));display:grid;grid-template-columns:repeat(var(--cols),var(--cw));grid-auto-rows:var(--ch)}
.snap{grid-column:1;width:1px;scroll-snap-align:start}
.letter{display:grid;place-items:center;font-size:var(--big);line-height:1;user-select:none;-webkit-user-select:none;z-index:1}
.band{grid-column:1 / -1;z-index:0;position:relative;overflow:hidden;pointer-events:none}
.band.lobby{background-color:var(--wash);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:var(--cw) var(--ch);background-position:var(--ox) 0}
.band .tide{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--pink)}
.band.pink .tide{height:100%}
.band.just .tide{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.band.pink{background-image:linear-gradient(to right,rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.45) 1px,transparent 1px);background-size:var(--cw) var(--ch);background-position:var(--ox) 0}
.sec-title{display:grid;place-items:center;font-size:var(--big);line-height:1;z-index:1;user-select:none;transition:color .6s ease,opacity .6s ease}
.sec-sub{z-index:1;display:flex;align-items:center;padding:0 10px;font-size:var(--body);letter-spacing:.22em;text-transform:uppercase;transition:color .6s ease}
.on-pink{color:#fff}
.lockcell{z-index:1;display:grid;place-items:center;font-size:var(--mid);opacity:.3}

/* the boxes: one per action. The verb performs itself. */
.door{border:0;padding:0;margin:0;cursor:pointer;z-index:1;background-size:100% 100%;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .25s ease}
.door:hover{background-color:var(--wash)}
.door .lab{display:flex;font-size:var(--fs,20px);line-height:1;letter-spacing:.02em;pointer-events:none;white-space:pre}
.door .lab span{display:inline-block}
.door.done{background-color:var(--pink);color:#fff}
.door.done:hover{background-color:#c8006d}
.door.done.on-pink{background-color:#fff;color:var(--pink)}
.door.done.on-pink:hover{background-color:var(--wash)}
.door.last::after{content:"";position:absolute;inset:0;border:3px solid var(--ink);pointer-events:none}
.door.done.last::after{border-color:#fff;inset:5px}
.door .pic{width:100%;flex:1;min-height:0;display:grid;place-items:center;pointer-events:none}
.door .pic svg{height:100%;width:auto;max-width:100%}
.door.tall .lab{padding-bottom:10px}
.arrow{z-index:2;border:0;background:var(--paper);font-size:var(--big);line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.arrow.on-pink{background:var(--pink);color:#fff}
.endbtn{z-index:2;display:flex;align-items:center;justify-content:center}
.btn{white-space:nowrap;background:var(--paper);border:1px solid currentColor;border-radius:0;padding:.55em .9em;cursor:pointer;letter-spacing:.08em;touch-action:manipulation;color:var(--ink)}
.btn:active{background:var(--ink);color:var(--paper)}

/* verbs in motion */
.run .lab span{animation:var(--k) 1.25s ease-in-out both;animation-delay:calc(var(--i) * 70ms)}
.run .lab.whole span{animation-delay:0s}
@keyframes k-bounce{0%,100%{transform:none}35%{transform:translateY(-38%)}60%{transform:translateY(6%)}}
@keyframes k-wave{0%,100%{transform:none}25%{transform:translateY(-28%)}75%{transform:translateY(28%)}}
@keyframes k-slide{0%,100%{transform:none;opacity:1}45%{transform:translateX(90%);opacity:0}46%{transform:translateX(-90%);opacity:0}}
@keyframes k-zoom{0%,100%{transform:none}50%{transform:scale(1.6)}}
@keyframes k-shake{0%,100%{transform:none}10%,50%,90%{transform:translateX(-12%) rotate(-6deg)}30%,70%{transform:translateX(12%) rotate(6deg)}}
@keyframes k-spin{from{transform:none}to{transform:rotate(360deg)}}
@keyframes k-flip{from{transform:none}to{transform:rotateX(360deg)}}
@keyframes k-type{0%{opacity:0}100%{opacity:1}}
@keyframes k-del{0%,60%{opacity:1}61%,100%{opacity:0}}
@keyframes k-squash{0%,100%{transform:none}50%{transform:scale(1.3,.45) translateY(55%)}}
@keyframes k-spread{0%,100%{transform:none}50%{transform:translateX(calc((var(--i) - var(--m)) * 22%))}}
@keyframes k-hug{0%,100%{transform:none}50%{transform:translateX(calc((var(--m) - var(--i)) * 18%))}}
@keyframes k-drip{0%,100%{transform:none;opacity:1}50%{transform:translateY(140%);opacity:0}51%{transform:translateY(-60%);opacity:0}}
@keyframes k-blink{0%,40%,80%{opacity:1}20%,60%{opacity:0}}
@keyframes k-mirror{0%,100%{transform:none}50%{transform:scaleX(-1)}}
@keyframes k-rise{0%{transform:translateY(160%);opacity:0}60%,100%{transform:none;opacity:1}}
@keyframes k-tilt{0%,100%{transform:none}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes k-swap{0%,100%{transform:none}50%{transform:translateY(calc(var(--s) * 45%))}}
@keyframes k-flee{0%,100%{transform:none}30%{transform:translate(calc(var(--s) * 30%),-40%) rotate(calc(var(--s) * 20deg))}}
@keyframes k-pulse{0%,100%{transform:none}20%,60%{transform:scale(1.35)}40%{transform:scale(1)}}
@keyframes k-ring{0%,100%{transform:none}10%,30%,50%,70%{transform:rotate(-8deg)}20%,40%,60%,80%{transform:rotate(8deg)}}
@keyframes k-sweep{0%,100%{transform:none;opacity:1}50%{transform:translateX(120%);opacity:0}51%{transform:translateX(-40%);opacity:0}}
@keyframes k-bow{0%,100%{transform:none}50%{transform:translateY(30%) rotate(calc(var(--s) * 8deg)) scaleY(.8)}}
@media (prefers-reduced-motion:reduce){.run .lab span{animation:none}}

/* clumsy drawings: the lines boil */
.doodle{color:var(--ink);overflow:visible}
.doodle *{vector-effect:non-scaling-stroke}
.doodle .ln{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.doodle .fl{fill:currentColor;stroke:none}
.boil{animation:boil .42s steps(1) infinite}
@keyframes boil{0%{filter:url(#b0)}33%{filter:url(#b1)}66%{filter:url(#b2)}}
@keyframes steam{0%{transform:translateY(4px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
.steam{animation:steam 2s ease-in-out infinite}
.steam.s2{animation-delay:1s}
@keyframes armsup{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--r))}}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-8px)}}
@keyframes popk{0%,60%,100%{transform:none}75%{transform:translate(2px,-14px)}}
@keyframes poseA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes poseB{0%,49%{opacity:0}50%,100%{opacity:1}}
@keyframes shuffle{0%,100%{transform:none}50%{transform:translateX(3px)}}
@keyframes talk{0%,45%,100%{opacity:1}55%,90%{opacity:.15}}

/* ---------- SCENES ---------- */
.scene{position:fixed;inset:0;z-index:10;overflow:hidden;outline:none;cursor:pointer}
.scene.field{background-image:
    linear-gradient(to right,var(--line) 1px,transparent 1px),
    linear-gradient(to bottom,var(--line) 1px,transparent 1px),
    linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(to top right,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px))}
.scene[hidden]{display:none}
.scene.inv{--paper:#e6007e;--ink:#ffffff;--line:rgba(255,255,255,.5);--wash:rgba(255,255,255,.18)}
.cells{position:absolute;left:var(--ox);top:0;display:grid;grid-template-columns:repeat(var(--cols),var(--cw));grid-auto-rows:var(--ch)}
.stage{display:grid;grid-template-columns:repeat(8,var(--cw));grid-template-rows:repeat(8,var(--ch));cursor:auto}
.stage .big{display:grid;place-items:center;font-size:var(--big);line-height:1;user-select:none;-webkit-user-select:none}
.dir{grid-row:2;grid-column:1 / -1;display:flex;align-items:center;justify-content:center;font-size:var(--body);letter-spacing:.04em;user-select:none;-webkit-user-select:none}
.play{grid-row:3 / span 6;grid-column:1 / -1;position:relative;min-width:0;min-height:0}
.play > *{position:absolute}
.ownmark{position:absolute;border:3px solid var(--ink);pointer-events:none;z-index:8}
@keyframes waveX{to{transform:translateX(-50%)}}
.cue{outline:2px solid transparent;outline-offset:4px;animation:cue 1.4s ease-in-out infinite}
@keyframes cue{0%,100%{outline-color:transparent}50%{outline-color:var(--ink)}}

/* parts used by the scenes */
.ink{background:var(--ink)}
.frame{border:1px solid var(--ink)}
.dash{border:1px dashed var(--ink)}
.grab{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.press{cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.tap{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.glyph{display:grid;place-items:center;color:var(--paper);font-size:var(--mid);line-height:1}
.cellbox{display:grid;place-items:center;font-size:var(--big);line-height:1}
.snapback{transition:transform .3s ease}
.flyoff{transition:transform .5s ease,opacity .5s ease}
.slowmo{transition:transform .5s ease}
.feed{overflow-y:auto;overscroll-behavior:contain;border-left:1px solid var(--ink);border-right:1px solid var(--ink);background:var(--paper)}
.feed .post{height:calc(var(--ch) * 1.2);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:10px}
.feed .post i{background:var(--wash)}
.feed .post b{display:flex;flex-direction:column;gap:6px}
.feed .post b u{display:block;height:8px;background:var(--line);text-decoration:none}
.sq{display:grid;place-items:center}
.sq::after{content:"";width:34%;aspect-ratio:1;border:1px solid var(--ink)}
.sq.on{background:var(--ink)}
.sq.on::after{border-color:var(--paper)}
.card{background:var(--paper);border:1px solid var(--ink);display:grid;place-items:center;font-size:var(--big)}
.bit{width:calc(var(--cw) * .22);height:calc(var(--cw) * .22);background:var(--ink)}
.input-line{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid currentColor;border-radius:0;padding:.35em 0;letter-spacing:.12em;caret-color:var(--ink);font-size:max(16px,var(--body))}
.caret::after{content:"";position:absolute;left:30%;top:20%;width:2px;height:60%;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hide-in{opacity:0;font-size:16px;border:0;padding:0;background:transparent;color:transparent;caret-color:transparent}
.popup{background:var(--paper);border:1px solid var(--ink);box-shadow:6px 6px 0 var(--wash)}
.popup .bar{position:absolute;left:0;right:0;top:0;height:calc(var(--ch) * .32);background:var(--ink)}
.popup .x{position:absolute;right:0;top:0;width:calc(var(--ch) * .32);height:calc(var(--ch) * .32);border:0;background:var(--paper);color:var(--ink);cursor:pointer;font-size:calc(var(--ch) * .24);line-height:1;padding:0;border-left:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.popup .lines{position:absolute;left:12%;right:12%;top:45%;display:flex;flex-direction:column;gap:7px}
.popup .lines u{display:block;height:7px;background:var(--line);text-decoration:none}
.spinner{display:grid;place-items:center;font-size:var(--mid);opacity:0}
.pc{border-left:1px solid var(--line)}
.pc.on{background:var(--ink)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.knock-ripple{border:2px solid var(--ink);pointer-events:none;animation:ripple .6s ease-out forwards}
@keyframes ripple{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.door3d{perspective:800px}
.leaf{position:absolute;inset:0;background:var(--paper);border:1px solid var(--ink);transform-origin:left center;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
.leaf::after{content:"";position:absolute;right:14%;top:50%;width:10%;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.sheet{perspective:900px}
.sheet .half{position:absolute;top:0;bottom:0;width:50%;background:var(--paper);border:1px solid var(--ink);
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:var(--cw) var(--ch)}
.sheet .r{left:50%;transform-origin:left center;transform:rotateY(calc(var(--a,0) * -1deg));transform-style:preserve-3d;backface-visibility:visible}
.sheet .r.back{background:var(--wash)}
.flipcard{perspective:700px;cursor:pointer;touch-action:manipulation}
.flipcard .in{position:absolute;inset:6px;transition:transform .45s ease;transform-style:preserve-3d}
.flipcard.up .in{transform:rotateY(180deg)}
.flipcard .f,.flipcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--ink);display:grid;place-items:center}
.flipcard .b{background:var(--ink)}
.flipcard .f{background:var(--paper);transform:rotateY(180deg);font-size:var(--big);line-height:1}
.flipcard.got .f{background:var(--wash)}
.glass{border:2px solid var(--ink);border-top:0;overflow:hidden;transform-origin:85% 100%}
.glass .lq{position:absolute;left:0;right:0;bottom:0;background:var(--ink);transition:height .1s linear}
.stream{background:var(--ink);opacity:0;transition:opacity .15s ease}
.dot{width:max(24px,calc(var(--cw) * .3));height:max(24px,calc(var(--cw) * .3));transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer;touch-action:manipulation;padding:0}
.dot.hit{background:var(--ink)}
.dot.next{animation:cue 1s ease-in-out infinite;outline:2px solid transparent;outline-offset:5px}
.plank{height:4px;background:var(--ink);transform-origin:center}
.ball{width:calc(var(--cw) * .5);height:calc(var(--cw) * .5);border-radius:50%;background:var(--ink);margin-left:calc(var(--cw) * -.25)}
.pad{border:1px solid var(--ink);background:var(--paper);cursor:pointer;touch-action:manipulation;transition:background-color .12s ease}
.pad.lit{background:var(--ink)}
.ticks{display:flex;gap:4px;justify-content:center;pointer-events:none}
.ticks i{width:var(--box);height:var(--box);border:1px solid var(--ink)}
.ticks i.on{background:var(--ink)}
.curtain{background:repeating-linear-gradient(to right,var(--ink) 0,var(--ink) calc(var(--cw) * .5),#c8006d calc(var(--cw) * .5),#c8006d var(--cw));touch-action:none;cursor:ns-resize}
.curtain::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 50% 0,var(--ink) 4px,transparent 5px) 0 0/var(--cw) 10px}
.hidden-name{position:absolute;opacity:0;pointer-events:none}

.sq{border:0;background:transparent;padding:0}
.kern{width:calc(var(--cw) * .62);height:calc(var(--cw) * .62);border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;touch-action:manipulation}
.label{display:grid;place-items:center;font-size:var(--mid);line-height:1;user-select:none;-webkit-user-select:none;pointer-events:none}
.ring{animation:k-ring .9s ease-in-out infinite}
.fill-up{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ink)}
.bigbtn{border:1px solid var(--ink);background:var(--paper);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;font-size:var(--body);letter-spacing:.12em;overflow:hidden}
.bigbtn span{position:relative;z-index:1}
.fig svg,.pic2 svg{width:100%;height:100%}
.namecell{display:grid;place-items:center;font-size:var(--big);line-height:1}

/* ---------- INTERMISSION: drawn, not gridded ---------- */
.band.lobby{background-color:var(--wash);background-image:none;margin:0 calc(var(--ox) * -1)}
.band.lobby.pink{background-image:none}
.toon-title{z-index:1;display:flex;flex-direction:column;justify-content:center;font-size:var(--big);line-height:1;color:transparent;-webkit-text-stroke:2px var(--ink);
  user-select:none;pointer-events:none;animation:boil .42s steps(1) infinite;padding-left:6px;letter-spacing:.06em}
.toon-title .tl{display:flex}
.toon-title.on-pink{-webkit-text-stroke-color:#fff}
.toon-title.faint{opacity:.28}
.jig{display:inline-block;transform:rotate(var(--r,0deg));animation:jig 1.3s steps(2) infinite;animation-delay:var(--d,0ms)}
@keyframes jig{0%{transform:rotate(var(--r,0deg)) translateY(0)}50%{transform:rotate(calc(var(--r,0deg) * -1)) translateY(-5%)}}
.lobbyarea{z-index:1;position:relative;min-width:0;min-height:0}
.toon-door{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--ink);
  transform:rotate(var(--t,0deg));transition:transform .25s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.toon-door:hover,.toon-door:focus-visible{transform:rotate(calc(var(--t,0deg) * -1)) scale(1.06)}
.toon-door .pic{flex:1;min-height:0;width:100%;display:grid;place-items:center;position:relative;z-index:1;pointer-events:none}
.toon-door .pic svg{position:absolute;inset:0;width:100%;height:100%}
.toon-door .doodle{color:inherit}
.toon-door .lab{position:relative;z-index:1;font-size:var(--fs);line-height:1.1;padding:8px 0 2px;flex:none;animation:boil .42s steps(1) infinite;pointer-events:none;display:flex}
.toon-door .lab span{display:inline-block}
.toon-door .blob{position:absolute;top:0;left:8%;right:8%;bottom:calc(var(--fs) * 1.5 + 8px);border-radius:58% 42% 55% 45% / 48% 60% 40% 52%;background:var(--pink);opacity:0;transform:scale(.6);transition:opacity .3s ease,transform .3s ease;animation:boil .42s steps(1) infinite;pointer-events:none}
.toon-door.done .blob{opacity:1;transform:none}
.toon-door.done{color:#fff}
.toon-door.on-pink{color:#fff}
.toon-door.done.on-pink{color:var(--pink)}
.toon-door.done.on-pink .blob{background:#fff}
.arrow.toon{background:transparent;animation:boil .42s steps(1) infinite}

.scene.toon{background-color:var(--wash);background-image:none;cursor:auto}
.scene.toon .open{background-color:transparent;background-image:none}
.scene.toon .stage .big{color:transparent;-webkit-text-stroke:2px var(--ink);animation:boil .42s steps(1) infinite,jig 1.3s steps(2) infinite;animation-delay:0ms,var(--d,0ms);transform:rotate(var(--r,0deg))}
.scene.toon .dir,.scene.toon .frame,.scene.toon .ticks,.scene.toon .ink.grab,.scene.toon .floorline,.scene.toon .label{animation:boil .42s steps(1) infinite}
.scene.toon .frame{border-width:2px;border-radius:12px 16px 9px 18px / 14px 10px 18px 12px}
.scene.toon .ticks i{border-radius:50%;border-width:2px}
.scene.toon .ink.grab{border-radius:48% 52% 46% 54%}
.floorline{border:2px solid var(--ink);border-radius:40px;transition:background-color .08s ease}
.toon-close{position:absolute;top:12px;right:14px;width:max(40px,calc(var(--cw) * .7));height:max(40px,calc(var(--cw) * .7));border:0;background:transparent;padding:0;cursor:pointer;z-index:20;color:var(--ink)}
.toon-close svg{width:100%;height:100%}
.toon-close .ln{stroke-width:3}

.toon-door .lab{color:var(--ink)}
.toon-door.on-pink .lab{color:#fff}

/* a cell that holds a letter is never struck: a blank box with only the letter in it */
.letter,.sec-title{background-color:var(--paper);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% 100%}
.sec-title.on-pink{background:transparent}
.sec-title.faint{color:var(--line);opacity:1}

.navarrow.beckon{outline:2px solid transparent;outline-offset:4px;animation:cue 1.2s ease-in-out infinite}

.navarrow.toon{background:transparent;animation:boil .42s steps(1) infinite}
.navarrow.toon.beckon{animation:boil .42s steps(1) infinite,cue 1.2s ease-in-out infinite}
.navarrow.toon:hover{background:transparent;transform:scale(1.1)}

/* ---------- grid parts: everything sits in whole cells ---------- */
.ico{width:60%;height:60%;overflow:visible;color:inherit}
.ico .ln{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ico .fl{fill:currentColor}
.cell-c{display:grid;place-items:center}
.on-ink{color:var(--paper)}
.c-ink{background:var(--ink)}
.c-wash{background:var(--wash)}
.c-frame{border:1px solid var(--ink)}
.c-dash{border:1px dashed var(--ink)}
.faint-dash{border-color:var(--line)}
.mcell{border:1px solid var(--ink);background:var(--paper)}
.mcell.on{background:var(--ink)}
.mcell.low{background:var(--wash)}
.mcell.on.low{background:var(--ink)}
.flash{pointer-events:none}
.rowbar{background:linear-gradient(var(--wash),var(--wash)) 10px 50% / calc(100% - 20px) 34% no-repeat}
.bitcell{display:grid;place-items:center;pointer-events:none}
.bitcell::after{content:"";width:30%;aspect-ratio:1;background:var(--ink)}
.bitcell.out{visibility:hidden}
.fogcell{background:#efe9ec;transition:opacity .15s steps(1, end)}
.fogcell.gone{opacity:0}
.peelcell{transition:none}
.peelcell.off{background:transparent;border:1px dashed var(--ink)}
.peelcell.corner{background:linear-gradient(135deg,var(--ink) 62%,var(--wash) 62%)}
.leaf{border:1px solid var(--ink);background:var(--paper);transform-origin:left center;transition:transform .5s steps(4, end)}
.leaf::after{content:"";position:absolute;right:20%;top:50%;width:12%;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.leaf.opened{transform:scaleX(.12)}
.glassbox{border:2px solid var(--ink);border-top:0}
.dotcell{border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation}
.dotcell::after{content:"";width:34%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.dotcell.hit::after{background:var(--ink)}
.dotcell.next{animation:cue 1s ease-in-out infinite;outline:2px solid transparent;outline-offset:-4px}
.paint.on{background:var(--ink)}
.headcell{display:grid;place-items:center}
.headcell::after{content:"";width:70%;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.c-ink.glow{outline:3px solid var(--wash);outline-offset:-6px}
.popup{background:var(--paper);border:1px solid var(--ink);box-shadow:none}
.popup .xbtn{background:var(--paper);color:var(--ink);padding:0}
.card{background:var(--paper);border:1px solid var(--ink);color:var(--ink)}
.sheet{perspective:none}
.flipcard{perspective:none}
.flipcard .f{font-size:inherit;color:var(--ink)}
.flipcard .in{inset:8px}
.bigbtn{display:grid;place-items:center}
.bigbtn span{position:relative;z-index:1}
.curtain::after{display:none}
.feed{scroll-snap-type:y mandatory}
.feed .post{height:var(--ch);scroll-snap-align:start;grid-template-columns:var(--cw) 1fr;padding:0;gap:0}
.feed .post i{margin:10px;background:var(--wash)}
.feed .post b{justify-content:center;padding-right:12px}

.navarrow{overflow:hidden}
.navarrow .ico{width:56%;height:56%}

/* the finishing fill: pink tiles pressed into the grid, cell by cell */
.mosaic{position:absolute;left:calc(var(--ox) - var(--cw));top:0;display:grid;z-index:30;pointer-events:none}
.mosaic i{background:var(--pink);transform:scale(0);animation:tile .24s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes tile{0%{transform:scale(.5)}100%{transform:scale(1)}}
/* in the intermission the tiles are drawn blobs that overlap, so the grid never shows */
.mosaic.drawnfill{animation:boil .42s steps(1) infinite}
.mosaic.drawnfill i{border-radius:46% 54% 40% 60% / 55% 45% 58% 42%;animation-name:blobtile}
.mosaic.drawnfill i:nth-child(3n){border-radius:60% 40% 52% 48% / 42% 58% 45% 55%}
.mosaic.drawnfill i:nth-child(4n+1){border-radius:38% 62% 58% 42% / 50% 40% 60% 50%}
@keyframes blobtile{0%{transform:scale(.6)}100%{transform:scale(1.55)}}
@media (prefers-reduced-motion:reduce){.mosaic i{animation-duration:1ms}}
</style>

<body>
<!-- the wobble for the hand-drawn lines -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="b0"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <filter id="b1"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <filter id="b2"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</svg>

<!-- HOME: one page per section, side by side. Only the arrows move between them. -->
<main id="home" aria-label="02 Verbing">
  <div class="strip" id="strip"></div>
</main>
<button class="navarrow" id="navPrev" type="button" aria-label="Previous section"></button>
<button class="navarrow" id="navNext" type="button" aria-label="Next section"></button>

<script>
(() => {
/* ================= THE SCRIPT ================= */
const A = (v, p, k, s) => ({ v, p, k, s: !!s });   // verb, past tense, motion, whole-word motion
const ACTS = [
  { id: 'I', title: ['ACT I'], sub: 'given actions', h: 1, verbs: [
    A('UNLOCK','UNLOCKED','k-slide',1), A('SCROLL','SCROLLED','k-wave'), A('TAP','TAPPED','k-bounce'), A('SWIPE','SWIPED','k-slide',1),
    A('LIKE','LIKED','k-pulse',1), A('ZOOM','ZOOMED','k-zoom',1), A('DRAG','DRAGGED','k-sweep'), A('HOLD','HELD','k-squash'),
    A('TYPE','TYPED','k-type'), A('DELETE','DELETED','k-del'), A('SELECT','SELECTED','k-blink'), A('COPY','COPIED','k-spread'),
    A('REFRESH','REFRESHED','k-spin'), A('WAIT','WAITED','k-blink',1), A('SEARCH','SEARCHED','k-zoom'), A('CLOSE','CLOSED','k-hug') ] },
  { id: 'II', title: ['ACT II'], sub: 'rewritten actions', h: 1, verbs: [
    A('WIPE','WIPED','k-sweep'), A('PEEL','PEELED','k-tilt',1), A('FOLD','FOLDED','k-mirror',1), A('KNOCK','KNOCKED','k-ring',1),
    A('SHAKE','SHOOK','k-shake'), A('CATCH','CAUGHT','k-flee'), A('STACK','STACKED','k-rise'), A('STIR','STIRRED','k-spin'),
    A('SWEEP','SWEPT','k-sweep'), A('ROTATE','ROTATED','k-spin',1), A('FLIP','FLIPPED','k-flip'), A('POUR','POURED','k-drip'),
    A('CONNECT','CONNECTED','k-hug'), A('BALANCE','BALANCED','k-tilt',1) ] },
  { id: 'INT', title: ['INTER', 'MISSION'], sub: '', h: 2, lobby: true, verbs: [
    A('STRETCH','STRETCHED','k-spread'), A('SIP','SIPPED','k-drip'), A('SNACK','SNACKED','k-bounce'),
    A('CHAT','CHATTED','k-swap'), A('DANCE','DANCED','k-wave'), A('QUEUE','QUEUED','k-slide') ] },
  { id: 'III', title: ['ACT III'], sub: 'shared actions', h: 1, verbs: [
    A('PASS','PASSED','k-slide',1), A('SWAP','SWAPPED','k-swap'), A('JOIN','JOINED','k-hug'), A('WAVE','WAVED','k-wave'),
    A('FOLLOW','FOLLOWED','k-wave'), A('MIRROR','MIRRORED','k-mirror',1), A('ECHO','ECHOED','k-blink'), A('HUG','HUGGED','k-hug'),
    A('ANSWER','ANSWERED','k-ring',1), A('INVITE','INVITED','k-slide',1) ] },
  { id: 'CC', title: ['CURTAIN', 'CALL'], sub: '', h: 1, verbs: [
    A('APPLAUD','APPLAUDED','k-pulse'), A('BOW','BOWED','k-bow'), A('SIGN','SIGNED','k-type'), A('LOWER','LOWERED','k-drip',1) ] },
];
const ALL = []; ACTS.forEach((a, ai) => a.verbs.forEach(x => { x.act = ai; x.n = ALL.length + 1; ALL.push(x); }));
const N = ALL.length;
const BYV = Object.fromEntries(ALL.map(x => [x.v, x]));

const $ = id => document.getElementById(id);
const root = document.documentElement;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover: hover)').matches;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ss = { get(k, d) { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const done = new Set(ss.get('verbing-done', []));
const OPEN_ALL = /[?&#]open\b/.test(location.search + location.hash);
let lastInput = performance.now();
['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(t => addEventListener(t, () => { lastInput = performance.now(); }, { passive: true, capture: true }));

/* ================= DRAWINGS (clumsy, boiling lines) ================= */
let uid = 0;
const svgEl = (inner, vb = '0 0 100 100') => `<svg class="doodle boil" viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
const D = {
  STRETCH: () => svgEl(`<circle class="ln" cx="50" cy="22" r="9"/><path class="ln" d="M50 31 L50 63 M50 63 L40 90 M50 63 L61 90"/>
    <path class="ln arm" data-side="-1" d="M50 39 L31 55"/><path class="ln arm" data-side="1" d="M50 39 L69 55"/>`),
  SIP: () => { const id = 'cup' + (uid++); return svgEl(`<defs><clipPath id="${id}"><path d="M27 40 L34 87 Q35 91 40 91 L60 91 Q65 91 66 87 L73 40 Z"/></clipPath></defs>
    <rect class="fl lq" x="20" y="46" width="60" height="50" clip-path="url(#${id})" style="transition:transform .4s ease;transform-box:fill-box"/>
    <path class="ln" d="M27 40 L34 87 Q35 91 40 91 L60 91 Q65 91 66 87 L73 40 Z"/><path class="ln" d="M71 51 Q87 50 85 63 Q83 74 68 71"/>
    <path class="ln steam" d="M42 33 Q37 25 43 19 Q49 13 45 5"/><path class="ln steam s2" d="M57 33 Q52 25 58 19 Q64 13 60 5"/>`); },
  SNACK: () => svgEl(`<path class="ln" d="M29 42 L36 92 L64 92 L71 42 Z"/><path class="ln" d="M41 42 L44 92 M50 42 L50 92 M59 42 L56 92"/>
    <g class="pile"><circle class="ln" cx="39" cy="36" r="6"/><circle class="ln" cx="51" cy="31" r="7" style="animation:popk 1.6s ease-in-out infinite"/><circle class="ln" cx="62" cy="36" r="6" style="animation:popk 1.6s .8s ease-in-out infinite"/></g>`),
  CHAT: () => svgEl(`<circle class="ln" cx="24" cy="66" r="9"/><path class="ln" d="M12 94 Q24 76 36 94"/>
    <circle class="ln" cx="76" cy="66" r="9"/><path class="ln" d="M64 94 Q76 76 88 94"/>
    <g class="bL" style="animation:talk 2.4s ease-in-out infinite"><path class="ln" d="M8 16 H46 V42 H30 L22 51 L24 42 H8 Z"/><path class="ln" d="M14 25 Q20 21 26 25 T38 25 M14 33 Q20 29 26 33"/></g>
    <g class="bR" style="animation:talk 2.4s 1.2s ease-in-out infinite"><path class="ln" d="M54 16 H92 V42 H76 L78 51 L70 42 H54 Z"/><path class="ln" d="M60 25 Q66 21 72 25 T84 25 M60 33 Q66 29 72 33"/></g>`),
  DANCE: () => svgEl(`<g style="animation:hop .6s ease-in-out infinite">
    <g style="animation:poseA 1.2s steps(1) infinite"><circle class="ln" cx="50" cy="20" r="8"/><path class="ln" d="M50 28 L50 60 M50 36 L32 22 M50 36 L68 22 M50 60 L38 86 M50 60 L64 84"/></g>
    <g style="animation:poseB 1.2s steps(1) infinite"><circle class="ln" cx="52" cy="20" r="8"/><path class="ln" d="M51 28 L49 60 M50 36 L30 44 M50 36 L70 30 M49 60 L42 88 M49 60 L70 70"/></g></g>
    <path class="ln" d="M20 94 H80"/>`),
  QUEUE: () => svgEl(`<rect class="ln" x="78" y="30" width="17" height="62"/><text x="86.5" y="24" font-size="10" text-anchor="middle" fill="currentColor" font-family="Courier New, monospace">WC</text>
    <g style="animation:shuffle 1.4s ease-in-out infinite">${[12, 30, 48, 64].map((x, i) => `<g><circle class="ln${i === 0 ? '' : ''}" cx="${x}" cy="57" r="5"/><path class="ln" d="M${x} 62 L${x} 80 M${x} 80 L${x - 5} 92 M${x} 80 L${x + 5} 92 M${x} 67 L${x - 6} 75 M${x} 67 L${x + 6} 75"/></g>`).join('')}</g>
    <path class="ln" d="M4 94 H96"/>`),
  HAND: () => svgEl(`<path class="ln" d="M38 92 L38 54 Q38 44 46 44 L46 22 Q46 15 51 15 Q56 15 56 22 L56 40 Q57 33 62 33 Q67 33 67 40 L67 70 Q67 92 52 92 Z"/>
    <path class="ln" d="M38 62 Q27 52 22 58 Q19 64 38 76"/><path class="ln" d="M56 40 L56 56 M46 44 L46 56"/>`),
  PHONE: () => svgEl(`<rect class="ln" x="32" y="12" width="36" height="76" rx="5"/><path class="ln" d="M44 20 H56 M46 80 H54"/>
    <path class="ln ringa" d="M22 34 Q14 50 22 66 M78 34 Q86 50 78 66"/><path class="ln ringb" d="M14 26 Q2 50 14 74 M86 26 Q98 50 86 74"/>`),
};

/* ================= GRID ================= */
let G = null;
function measure() {
  const vw = innerWidth, vh = innerHeight;
  const ch = Math.min(vh / 8, vw / 8 * 11 / 8.5, 112), cw = ch * 8.5 / 11;
  const cols = Math.max(8, Math.floor(vw / cw + 1e-6)), vrows = Math.max(8, Math.floor(vh / ch + 1e-6));
  return { vw, vh, cw, ch, cols, vrows, ox: (vw - cols * cw) / 2, sc0: Math.floor((cols - 8) / 2), sr0: Math.floor((vrows - 8) / 2) };
}
function applyGrid(g) {
  const s = root.style;
  s.setProperty('--cw', g.cw + 'px'); s.setProperty('--ch', g.ch + 'px'); s.setProperty('--ox', g.ox + 'px'); s.setProperty('--cols', g.cols); s.setProperty('--vw', g.vw + 'px');
}

/* ================= HOME: one page per section, side by side, moved only with the arrows ================= */
const home = $('home'), strip = $('strip');
const actDone = i => ACTS[i].verbs.every(x => done.has(x.n));
/* for the demonstration: five finished actions in a section open the next one.
   (Set NEED to Infinity to ask for every action.) A section still turns pink only when all of it is done. */
const NEED = 5;
const actPassed = i => ACTS[i].verbs.filter(x => done.has(x.n)).length >= Math.min(NEED, ACTS[i].verbs.length);
const unlocked = i => OPEN_ALL || i === 0 || actPassed(i - 1);
const PAGES = ACTS.length + 1;                 /* five sections, then THE END */
const pageOpen = p => p < ACTS.length ? unlocked(p) : (OPEN_ALL || actPassed(ACTS.length - 1));
let doorEls = [], justFlooded = -1, lastDoor = 0, page = ss.get('verbing-page', 0), nextCue = false;
let pg = null;                                 /* the grid of the page being built */

function place(el, r, c, rs = 1, cs = 1) { el.style.gridArea = `${r + 1} / ${c + 1} / span ${rs} / span ${cs}`; pg.appendChild(el); return el; }
function letters(text, r, c, cls) {
  [...text].forEach((ch, i) => { if (ch === ' ') return; const d = document.createElement('div'); d.className = cls; d.textContent = ch; d.setAttribute('aria-hidden', 'true'); place(d, r, c + i); });
}
function labelHTML(word, k, whole) {
  const m = (word.length - 1) / 2;
  return `<span class="lab${whole ? ' whole' : ''}" style="--k:${k}">` + [...word].map((ch, i) => `<span style="--i:${i};--m:${m};--s:${i % 2 ? 1 : -1}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('') + '</span>';
}
function newPage(cls) {
  const p = document.createElement('section'); p.className = 'page field ' + (cls || '');
  const g = document.createElement('div'); g.className = 'pgrid'; p.appendChild(g); strip.appendChild(p); pg = g; return p;
}
function buildHome() {
  const g = G, S0 = g.sc0, off = Math.max(0, Math.floor((g.vrows - 8) / 2));
  strip.textContent = ''; doorEls = [];
  strip.style.width = (PAGES * g.vw) + 'px';
  ACTS.forEach((act, ai) => {
    const complete = actDone(ai), open = unlocked(ai);
    const p = newPage((act.lobby ? 'lobby' : '') + (complete ? ' pink' : '') + (ai === justFlooded ? ' just' : ''));
    p.setAttribute('aria-label', act.title.join(' ').toLowerCase());
    /* every page keeps the same rhythm: title, an empty row, then the boxes from the fifth row */
    let r = act.title.length > 1 ? off + 1 : off + 2;
    if (ai === 0) {                                  /* the title, top-left, on the first page only */
      if (g.cols >= 10) { letters('02', off, 0, 'letter'); letters('VERBING', off, 3, 'letter'); }
      else { letters('02VERB', off, 0, 'letter'); letters('ING', off + 1, 0, 'letter'); r = off + 3; }
    }
    if (act.lobby) { buildLobby(act, ai, r, open, complete); return; }
    act.title.forEach(line => { letters(line, r, S0, 'sec-title' + (complete ? ' on-pink' : '')); r++; });
    r = Math.max(r + 1, off + 4);
    if (!open) return;
    act.verbs.forEach((x, i) => {
      const rr = r + Math.floor(i / 4), cc = S0 + (i % 4) * 2;
      const b = document.createElement('button'); b.type = 'button';
      const isDone = done.has(x.n), word = isDone ? x.p : x.v;
      b.className = 'open door' + (isDone ? ' done' : '') + (complete ? ' on-pink' : '') + (x.n === lastDoor ? ' last' : '');
      const fs = Math.min(g.ch * .3, (2 * g.cw - 18) / (Math.max(word.length, 4) * .62));
      b.style.setProperty('--fs', fs.toFixed(1) + 'px');
      b.innerHTML = labelHTML(word, x.k, x.s);
      b.setAttribute('aria-label', `${x.v.toLowerCase()}${isDone ? ', done' : ''}`);
      b.addEventListener('click', () => go(x.n));
      b.addEventListener('pointerenter', () => runLabel(b));
      b.addEventListener('focus', () => runLabel(b));
      place(b, rr, cc, 1, 2); doorEls[x.n] = b;
    });
  });
  /* the end */
  const finished = pageOpen(PAGES - 1);
  newPage('endpage').setAttribute('aria-label', 'the end');
  letters('THE END', off + 3, S0, 'sec-title' + (finished ? '' : ' faint'));
  if (finished) {
    const wrap = document.createElement('div'); wrap.className = 'endbtn';
    wrap.innerHTML = '<button class="btn" type="button">AGAIN</button>';
    wrap.firstChild.addEventListener('click', () => { done.clear(); ss.set('verbing-done', []); lastDoor = 0; buildHome(); turnTo(0); });
    place(wrap, off + 5, S0 + 2, 1, 4);
  }
  justFlooded = -1;
  page = clamp(page, 0, PAGES - 1); while (page > 0 && !pageOpen(page)) page--;
  turnTo(page, true);
}
/* the intermission is drawn, not gridded: a hand-drawn title and loose doodles, all wobbling */
const LOBBY = [[1, 2, -3], [35, 0, 2.5], [69, 6, -2], [3, 52, 2], [37, 50, -2.5], [69, 54, 3]];
const jigLetters = text => [...text].map((ch, i) => `<span class="jig" style="--r:${((i * 37) % 9 - 4) * .9}deg;--d:${-(i * 173 % 1300)}ms">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
function buildLobby(act, ai, r, open, pinkNow) {
  const S0 = G.sc0;
  const tt = document.createElement('div'); tt.className = 'toon-title' + (pinkNow ? ' on-pink' : '');
  tt.innerHTML = act.title.map(line => `<div class="tl">${jigLetters(line)}</div>`).join('');
  place(tt, r, S0, act.title.length, 8);
  r = Math.max(r + act.title.length + 1, Math.max(0, Math.floor((G.vrows - 8) / 2)) + 4);
  if (!open) return;
  const area = document.createElement('div'); area.className = 'lobbyarea'; place(area, r, S0, 4, 8);
  act.verbs.forEach((x, i) => {
    const isDone = done.has(x.n), word = isDone ? x.p : x.v, [lx, ly, t] = LOBBY[i];
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'toon-door' + (isDone ? ' done' : '') + (pinkNow ? ' on-pink' : '');
    Object.assign(b.style, { left: lx + '%', top: ly + '%', width: '30%', height: '46%' }); b.style.setProperty('--t', t + 'deg');
    const fs = Math.min(G.ch * .24, (8 * G.cw * .3 - 10) / (Math.max(word.length, 4) * .62));

B.INVITE = api => {
  api.dir('(send this page to someone)');
  const b = cell(api.play, 'bigbtn tap', 2, 1, 4, 1, 'button'); b.innerHTML = '<span>SEND</span>'; b.dataset.cue = ''; b.style.touchAction = 'manipulation';
  const plane = cell(api.play, 'c-ink', 3, 3);
  const fly = () => { plane.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(calc(var(--cw) * 4), calc(var(--ch) * -3))', opacity: 1 }], { duration: 600, easing: 'steps(4, end)', fill: 'forwards' }); api.done(); };
  b.addEventListener('click', async () => {
    if (api.isDone) return;
    const url = location.href.split('#')[0];
    try { if (navigator.share) await navigator.share({ title: '02 Verbing', url }); else if (navigator.clipboard) await navigator.clipboard.writeText(url); fly(); }
    catch (e) { if (e && e.name !== 'AbortError') fly(); }
  });
};

/* -------- CURTAIN CALL -------- */
B.APPLAUD = api => {
  api.dir('(clap eight times, fast)');
  const c = cell(api.play, 'c-frame tap', 2, 1, 4, 3, 'button'); c.style.background = 'var(--paper)'; c.dataset.cue = ''; c.setAttribute('aria-label', 'Clap');
  const claps = meter(api.play, 8, 5, 0); const ts = [];
  const clap = () => {
    if (api.isDone) return;
    const t = performance.now(); ts.push(t); while (ts.length && t - ts[0] > 4000) ts.shift(); claps(ts.length);
    c.animate([{ background: 'var(--ink)' }, { background: 'var(--paper)' }], { duration: 160, easing: 'steps(1, end)' });
    if (ts.length >= 8) api.done();
  };
  c.addEventListener('pointerdown', clap);
  api.key(e => { if (e.key === ' ' && !e.repeat) { e.preventDefault(); clap(); } });
  api.every(300, () => { const t = performance.now(); while (ts.length && t - ts[0] > 4000) ts.shift(); if (!api.isDone) claps(ts.length); });
};
B.BOW = api => {
  api.dir('(take a bow · pull the head down)');
  const STAND = [[3, 0], [3, 1], [3, 2], [3, 3], [3, 4]], BOWED = [[5, 2], [4, 2], [3, 2], [3, 3], [3, 4]];
  const parts = STAND.map(([x, y], i) => { const c = cell(api.play, i === 0 ? 'headcell' : 'c-ink', x, y); return c; });
  const zone = cell(api.play, 'grab', 2, 0, 3, 3); zone.dataset.cue = '';
  const pose = P => parts.forEach((c, i) => pos(c, P[i][0], P[i][1]));
  drag(zone, {
    move(e, dx, dy) { if (!api.isDone) pose(dy > G.ch * .8 ? BOWED : STAND); },
    end(e, dx, dy, moved) { if (api.isDone) return; if (dy > G.ch * .8 || !moved) { pose(BOWED); setTimeout(() => { pose(STAND); api.done(); }, 700); } else pose(STAND); },
  });
};
B.SIGN = api => {
  api.dir('(sign your name)');
  const row = cell(api.play, '', 1, 4, 6, 1); row.style.display = 'flex'; row.style.gap = '8px'; row.style.alignItems = 'center';
  row.innerHTML = '<input class="input-line" maxlength="16" autocomplete="off" aria-label="Your name" style="flex:1;text-transform:uppercase"><button class="btn" type="button">SIGN</button>';
  const inp = row.querySelector('input'), btn = row.querySelector('button'); inp.dataset.cue = '';
  const cells = []; for (let i = 0; i < 16; i++) cells.push(cell(api.play, 'namecell', i % 8, Math.floor(i / 8)));
  const show = v => cells.forEach((c, i) => { c.textContent = v[i] && v[i] !== ' ' ? v[i] : ''; });
  const sign = () => {
    const v = inp.value.trim().toUpperCase().slice(0, 16); if (!v) { inp.focus(); nudge(row); return; }
    show(v); inp.value = ''; inp.blur();
    try { const all = JSON.parse(localStorage.getItem('verbing-readers') || '[]'); all.push({ name: v, t: Date.now() }); localStorage.setItem('verbing-readers', JSON.stringify(all)); } catch (e) {}
    api.done();
  };
  btn.addEventListener('click', sign); inp.addEventListener('keydown', e => { if (e.key === 'Enter') sign(); });
  api.on('enter', () => { if (finePointer) setTimeout(() => inp.focus({ preventScroll: true }), 60); });
};
B.LOWER = api => {
  api.dir('(pull the curtain down)');
  const cur = cell(api.play, 'curtain', 0, 0, 8, 1); cur.dataset.cue = '';
  let h = 1, base = 1;
  const set = v => { h = clamp(Math.round(v), 1, 6); pos(cur, null, null, null, h); if (h === 6 && !api.isDone) api.done(); };
  drag(cur, { start() { base = h; }, move(e, dx, dy) { if (!api.isDone) set(base + dy / G.ch); }, end(e, dx, dy, moved) { if (!moved && !api.isDone) set(h + 1); } });
};


/* ================= START ================= */
navPrev.innerHTML = ico('left'); navNext.innerHTML = ico('right');
relayout();
route(false);
})();
